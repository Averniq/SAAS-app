apply plugin: 'com.android.application'

android {
    buildFeatures { buildConfig true }
    namespace = "com.aveniq.kitchen"
    compileSdk = rootProject.ext.compileSdkVersion
    sourceSets { androidTest.assets.srcDirs += ['../../tests/fixtures'] }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId "com.aveniq.kitchen"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.14.0"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}






// Refuse accidental hosted-backend debug APKs and debug-backend release APKs.
['Debug','Release'].each { variant ->
    def validation = tasks.register("validate${variant}KitchenBackend") {
        doLast {
            def configFile = file('src/main/assets/kitchen-print-backend.json')
            def webFile = file('src/main/assets/public/supabase-config.js')
            if (!configFile.exists() || !webFile.exists()) throw new GradleException('Prepare explicit kitchen backend assets before packaging.')
            def config = new groovy.json.JsonSlurper().parse(configFile)
            def origin = new URI(config.origin)
            def local = config.localDebug == true
            if (variant == 'Debug' && (!local || origin.scheme != 'http' || !(origin.host in ['127.0.0.1','10.0.2.2']))) throw new GradleException('Debug kitchen builds require an isolated local API.')
            if (variant == 'Release' && (local || origin.scheme != 'https' || origin.host in ['127.0.0.1','10.0.2.2','localhost'])) throw new GradleException('Release backend configuration and separate release approval required.')
            def source = webFile.getText('UTF-8').trim()
            def prefix = 'window.TABLEORDER_SUPABASE = '
            if (!source.startsWith(prefix) || !source.endsWith(';')) throw new GradleException('Explicit generated web backend configuration required.')
            def web = new groovy.json.JsonSlurper().parseText(source.substring(prefix.length(),source.length()-1))
            if (web.url != config.origin || web.publishableKey != config.publishableKey) throw new GradleException('Web and native kitchen backends must match.')
        }
    }
    tasks.configureEach { if (name == "pre${variant}Build") dependsOn validation }
}
