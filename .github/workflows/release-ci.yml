name: Release CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: release-ci-required
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONTEXT: ''
      AVENIQ_PUBLIC_CONFIG_MODE: development
      AVENIQ_SUPABASE_URL: ''
      AVENIQ_SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - name: Check out the PR merge candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build without a backend
        run: pnpm run build
      - name: Validate public config with synthetic fixtures
        run: node tests/test-build-public-supabase-config.mjs
      - name: Test tenant routing
        run: pnpm run test:tenant-routing
      - name: Test Staff Management
        run: pnpm run test:staff-management
      - name: Test Kitchen lifecycle contract
        run: node tests/test-kitchen-lifecycle-contract.mjs
      - name: Test authorization contracts
        run: |
          node tests/test-platform-admin-dashboard-authorization.mjs
          node tests/test-task5-task6-canonical-rpcs.mjs
