project_id = "aveniq-saas"

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 15

[studio]
enabled = true
port = 54333
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://localhost:4173"]
jwt_expiry = 3600
enable_signup = true

[auth.rate_limit]
email_sent = 3
sign_in_sign_ups = 5
token_verifications = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_expiry = 3600
