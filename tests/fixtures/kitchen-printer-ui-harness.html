<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen printing UI fixture — synthetic only</title><link rel="stylesheet" href="/styles.css"><body style="padding:1rem;background:#f1f5f9"><h1>Kitchen printing UI fixture — synthetic only</h1><p>This page tests UI behavior with controlled fake responses. It does not connect to a printer or prove backend integration.</p><label>Fixture state<select id="fixture"><option>Ready</option><option>Not Configured</option><option>Agent Offline</option><option>Printer Unreachable</option><option>Printing</option><option>Attention Required</option><option>Empty</option><option>Loading</option><option>Error</option></select></label><label>Role<select id="role"><option>owner</option><option>kitchen</option><option>staff</option><option>cashier</option><option>customer</option></select></label><label><input type="checkbox" id="failSave">Fail saves</label><button id="render" type="button">Render fixture</button><output id="counts" aria-live="polite">No actions</output><div id="fixtureRoot"></div><section id="unrelated-order-board"><h2>Independent Kitchen order</h2><p>Order 101 — 2 × ramen — Preparing</p></section><script type="module">
